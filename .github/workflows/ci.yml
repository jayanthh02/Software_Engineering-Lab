name: CI
on:
  push:
    branches: [main]
    paths: ['Mini_project/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['Mini_project/**', '.github/workflows/ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mini_project/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mini_project/server/package-lock.json
      - run: npm ci
      - run: npm test

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mini_project/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mini_project/client/package-lock.json
      - run: npm ci
      - run: npm run build